# ------------------------------------------------------------------------------------
# Workflow: Cucumber Tests
# Purpose:  Run Cucumber (TestNG) tests from GitHub Actions with a manual selector for
#           which suite to run (ui, backend, or all). Designed for teaching/demo.
#           - Shows how to pass inputs to a workflow (workflow_dispatch)
#           - Shows how to derive Maven/Cucumber tag filters from inputs
#           - Demonstrates headless Chrome setup in CI and artifact uploads
# ------------------------------------------------------------------------------------
name: Cucumber Tests

on:
  # Manual trigger from the Actions tab. Useful for demo and for running ad-hoc suites.
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run (affects Cucumber tag filter)"
        required: true
        default: "all"      # "all" means run without a tag filter
        type: choice
        options:
          - all              # Run all scenarios (no tag filter)
          - ui               # Only scenarios tagged with @ui
          - backend          # Only scenarios tagged with @backend

  # ------------------------------------------------------------------
  # Optional triggers for demo (commented so they don't execute by default)
  # Uncomment the blocks below when you want to enable them.
  #
  # Enable push trigger to run on branches whose name contains "feature"
  # push:
  #   branches:
  #     - '*feature*'   # any branch name containing the substring 'feature'
  #     # Alternative examples for your students:
  #     # - 'feature/**'    # names starting with 'feature/'
  #     # - '**/feature/**' # names containing '/feature/' as a path segment
  #
  # Enable a scheduled nightly run at 01:00 UTC on weekdays (Mon–Fri)
  # schedule:
  #   - cron: '0 1 * * 1-5'  # GitHub cron uses UTC. 0 1 * * 1-5 == 01:00 Mon–Fri
  # ------------------------------------------------------------------

jobs:
  tests:
    # The job name dynamically reflects the chosen suite from the manual input
    name: Run ${{ github.event.inputs.suite }} tests
    runs-on: ubuntu-latest   # Use the latest Ubuntu runner image from GitHub

    steps:
      # 1) Check out repository code so Maven can build and run tests
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Install Java 17 (Temurin distribution) and enable Maven dependency caching
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'     # Speeds up repeat runs by caching the ~/.m2/repository

      # 3) Install Google Chrome used by Selenium WebDriver in UI (@browser/@ui) tests
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      # (Optional) Print Chrome version to the logs for transparency/debugging in class
      - name: Show Chrome version
        run: |
          google-chrome --version || true

      # 4) Compute the Cucumber tag filter from the chosen "suite" input.
      #    - ui      -> -Dcucumber.filter.tags='@ui'
      #    - backend -> -Dcucumber.filter.tags='@backend'
      #    - all     -> (no tag filter)
      #
      #    We write the resulting string to $GITHUB_OUTPUT as the step output "value".
      #    The next step reads it via ${{ steps.tags.outputs.value }}.
      - name: Determine tag filter
        id: tags
        shell: bash
        run: |
          suite="${{ github.event.inputs.suite }}"
          if [[ "$suite" == "ui" ]]; then
            echo "value=-Dcucumber.filter.tags='@ui'" >> $GITHUB_OUTPUT
          elif [[ "$suite" == "backend" ]]; then
            echo "value=-Dcucumber.filter.tags='@backend'" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      # 5) Run tests with Maven.
      #    -Dtest=runners.TestNGRunner ensures the TestNG+Cucumber runner class is used.
      #    Hooks.java auto-detects CI (env CI/GITHUB_ACTIONS) and sets headless Chrome,
      #    so we don't need xvfb-run here.
      - name: Run tests
        run: |
          echo "Selected suite: ${{ github.event.inputs.suite }}"
          echo "Tag filter: ${{ steps.tags.outputs.value }}"
          mvn -B -Dtest=runners.TestNGRunner test ${{ steps.tags.outputs.value }}

      # 6) Upload reports as an artifact so students can download/explore them:
      #    - target/surefire-reports/** includes TestNG reports
      #    - target/cucumber-reports.html is the pretty Cucumber HTML report
      #    - target/screenshots/** holds per-scenario screenshots from Hooks.java
      #
      # "if: always()" ensures we still upload artifacts even if tests fail.
      - name: Upload TestNG and Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact name includes the GitHub run id and selected suite for clarity
          name: test-reports-${{ github.run_id }}-${{ github.event.inputs.suite || 'all' }}
          path: |
            target/surefire-reports/**
            target/cucumber-reports.html
            target/screenshots/**
          if-no-files-found: warn   # Don't fail the job if a path is missing (e.g., no screenshots for backend)
